name: Test Suite - PR Validation

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  push:
    # branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.11]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        
    - name: Lint with flake8 (optional check)
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
        
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml
        
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.9'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        
    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/
        
    - name: Run Safety check for dependencies
      run: |
        pip install -r requirements-test.txt
        safety check --json --output safety-report.json || true
        safety check

  pr-validation:
    name: PR Merge Validation
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Check if tests passed
      run: |
        echo "All tests passed! PR is ready for review."
        echo "This job will fail if any of the previous jobs failed."
        echo "When this job fails, GitHub branch protection will block the merge."
        
    - name: PR Status Check
      run: |
        echo "✅ All validation checks passed"
        echo "✅ Tests completed successfully"
        echo "✅ Security scans completed"
        echo "🎉 This PR is ready to be merged!"

  # This job will always run and provide a summary
  test-results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: always()
    
    steps:
    - name: Test Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.security-scan.result }}" == "failure" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **One or more checks failed. This PR cannot be merged until all issues are resolved.**" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All checks passed! This PR is ready for review and merge.**" >> $GITHUB_STEP_SUMMARY
        fi